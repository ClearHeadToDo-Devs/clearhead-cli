[package]
name = "cliche"
description = "A CLI tool and library for working with the clearhead framework"
version = "0.2.1"
authors = ["Darrion Burgess <darrionburgess@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ClearHeadToDo-Devs/tree-sitter-actions.git"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
comfy-table = "7.1"
config = "0.14"
dirs = "5.0"
quick-xml = { version = "0.31", features = ["serialize"] }
reqwest = { version = "0.11", features = ["blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25.1"
tree-sitter-actions = "0.5.2"

[dependencies.uuid]
version = "1.0"
# Lets you generate random UUIDs
features = [
  "serde",
  "v4",
  "v7",
]

[dev-dependencies]
assert_cmd = "2.1"
jsonschema = "0.18"
predicates = "3.0"
tempfile = "3.8"
