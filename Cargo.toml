[package]
name = "clearhead_cli"
description = "A CLI tool and library for working with the clearhead framework"
version = "0.2.1"
authors = ["Darrion Burgess <darrionburgess@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ClearHeadToDo-Devs/clearhead_cli.git"

[[bin]]
name = "clearhead"
path = "src/main.rs"

[[bin]]
name = "clearhead-lsp"
path = "src/lsp_main.rs"
required-features = ["lsp"]

[features]
default = ["lsp"]
# The `lsp` feature enables the Language Server Protocol server.
# Omit it for a lightweight CLI-only binary: `cargo build --no-default-features`
lsp = ["dep:tower-lsp-server", "dep:tokio", "dep:dashmap"]

[dependencies]
# Core library with pure business logic
clearhead_core = { path = "../clearhead-core", version = "0.2.0" }

# CLI-specific dependencies
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
clap_mangen = "0.3"
comfy-table = "7.1"
termtree = "1.0.0"
config = "0.15.19"
dirs = "6.0.0"
icalendar = "0.16.17"
shellexpand = "3.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
oxigraph = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26.3"
tree-sitter-actions = { path = "../tree-sitter-actions", version = "0.9.2" }

# LSP-only deps — only compiled when the `lsp` feature is enabled
dashmap = { version = "6.1.0", optional = true }
tokio = { version = "1.48.0", features = ["full"], optional = true }
tower-lsp-server = { version = "0.23.0", optional = true }

[dependencies.uuid]
version = "1.0"
# Lets you generate random UUIDs
features = [
  "serde",
  "v4",
  "v7",
]

[dev-dependencies]
assert_cmd = "2.1"
insta = { version = "1.45.1", features = ["redactions", "ron"] }
jsonschema = "0.18"
predicates = "3.0"
tempfile = "3.8"

[build-dependencies]
clap = { version = "4.0", features = ["derive"] }
clap_mangen = "0.3"
