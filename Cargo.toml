[package]
name = "clearhead_cli"
description = "A CLI tool and library for working with the clearhead framework"
version = "0.2.1"
authors = ["Darrion Burgess <darrionburgess@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ClearHeadToDo-Devs/clearhead_cli.git"

[dependencies]
automerge = "0.7.2"
autosurgeon = { version = "0.10.1", features = ["uuid"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
comfy-table = "7.1"
config = "0.14"
dirs = "5.0"
quick-xml = { version = "0.31", features = ["serialize"] }
reqwest = { version = "0.11", features = ["blocking"] }
rrule = "0.14.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
tower-lsp = "0.20.0"
tree-sitter = "0.25.1"
tree-sitter-actions = { version = "0.7.0", path = "../tree-sitter-actions" }

[dependencies.uuid]
version = "1.0"
# Lets you generate random UUIDs
features = [
  "serde",
  "v4",
  "v7",
]

[dev-dependencies]
assert_cmd = "2.1"
insta = { version = "1.45.1", features = ["redactions", "ron"] }
jsonschema = "0.18"
predicates = "3.0"
tempfile = "3.8"
